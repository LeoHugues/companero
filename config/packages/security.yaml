security:
    erase_credentials: false

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        members:
            # By username, whatever its case: see MemberRepository::loadUserByIdentifier().
            entity:
                class: App\Entity\Member

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: members
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
                username_parameter: pseudo
                password_parameter: password
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000 # one year: it lives on the phone's home screen
                always_remember_me: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/(connexion|bienvenue|rejoindre), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
