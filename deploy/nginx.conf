# Companero derrière nginx + PHP-FPM. À copier dans /etc/nginx/sites-available/companero,
# en adaptant le domaine, le dossier et le socket PHP-FPM ; HTTPS avec certbot (certbot --nginx).

server {
    listen 80;
    server_name companero.example.org;
    root /srv/companero/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Les assets compilés ont une empreinte dans leur nom : ils peuvent rester en cache longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'APK de l'appli Android et sa description, publiées par la CI : jamais en cache,
    # les téléphones y cherchent leurs mises à jour.
    location = /companero.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }
    location = /companero-apk.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Aucun autre fichier PHP ne doit être exécuté.
    location ~ \.php$ {
        return 404;
    }
}
